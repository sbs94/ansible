- name: Install Samba Server and Configure Samba User
  hosts: web
  become: yes
  vars_prompt:
    - name: "samba_user_password"
      prompt: "Please enter the password for the Samba user"
      private: yes  # 비밀번호를 숨김 처리

  tasks:
    # 1. samba 패키지 설치
    - name: Install Samba packages
      apt:
        name:
          - samba
          - samba-common
          - smbclient
        state: present
        update_cache: ye성s

    # 2. Samba 서비스가 시작되고 활성화되었는지 확인
    - name: Ensure Samba service is started and enabled
      service:
        name: smbd
        state: started
        enabled: yes

    # 3. samba 사용자 생성
    - name: Create Samba user (smbuser)
      user:
        name: smbuser
        password: "{{ samba_user_password | password_hash('sha512') }}"
        state: present

    # 4. Samba 사용자를 Samba 데이터베이스에 추가
    - name: Add Samba user to Samba database
      command: echo -e "{{ samba_user_password }}\n{{ samba_user_password }}" | smbpasswd -a
      args:
        creates: /etc/samba/smbpasswd
      become: yes

    # 5. Samba 사용자를 활성화 (smbuser)
    - name: Enable Samba user (smbuser)
      command: smbpasswd -e smbuser
      become: yes
      when: ansible_facts.packages['samba'] is defined

    # 6. smb.conf에서 Samba 공유 설정
    - name: Configure smb.conf for Samba share
      blockinfile:
        path: /etc/samba/smb.conf
        marker: "# {ansible_managed} #"
        block: |
          [humans]
          path = /humans
          browseable = yes
          read only = no
          guest ok = yes
          create mask = 0777
          directory mask = 0777

    # 7. Samba용 공유 디렉토리 생성
    - name: Create shared directory for Samba
      file:
        path: /humans
        state: directory
        owner: root
        group: sambashare
        mode: '0777'

    # 8. Samba 공유 디렉토리의 적절한 권한 설정
    - name: Set correct permissions for Samba shared directory
      file:
        path: /humans
        recurse: yes
        owner: smbuser
        group: sambashare
        mode: '0777'

    # 9. 변경 사항을 적용하기 위해 Samba 서비스 재시작
    - name: Reload Samba service to apply changes
      systemd:
        name: smbd
        state: reloaded
        enabled: yes
