# Ansible Playbook 예시: install_nginx.yml
# ---
- name: Install and configure Nginx on Ubuntu
  hosts: all
  become: yes  # 관리자 권한으로 실행
  tasks:
    # 1. apt 패키지 목록 갱신
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600  # 1시간 동안 유효한 캐시

    # 2. Nginx 설치
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    # 3. 각 도메인에 대한 기본 index.html 파일 생성
    - name: Create index.html for x.com
      copy:
        dest: /var/www/x/index.html
        content: "Hello~~!"

    # 4. Nginx 서비스 시작
    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes  # 부팅 시 자동 시작
